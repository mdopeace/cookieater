<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x2="0" y2="1">
      <stop stop-color="#1b1b1b"/>
      <stop offset="1" stop-color="#191919"/>
    </linearGradient>
    <linearGradient id="panel" x2="0" y2="1">
      <stop stop-color="#272622"/>
      <stop offset="1" stop-color="#1f1e1b"/>
    </linearGradient>
    <linearGradient id="gold" x2="0" y2="1">
      <stop stop-color="#f8d25b"/>
      <stop offset="1" stop-color="#f5cb56"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#f6cd50" stop-opacity=".09"/>
      <stop offset="1" stop-color="#f6cd50" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="panelClip">
      <rect x="668" y="80" width="540" height="620" rx="18"/>
    </clipPath>
    <symbol id="sparkle" viewBox="9 9 12 12">
      <path d="M15 10v10m-5-5h10m-8.54-3.54 7.08 7.08m0-7.08-7.08 7.08" fill="none" stroke="#f5cb56" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope=".32"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <ellipse cx="950" cy="392" rx="440" ry="455" fill="url(#glow)"/>

  <!-- Branding -->
  <image href="icon.png" x="78" y="70" width="46" height="46"/>
  <text x="142" y="96" fill="#f6f0df" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="27" font-weight="800" letter-spacing="-.8">Cookieater</text>
  <text x="142" y="115" fill="#aaa391" font-family="system-ui, sans-serif" font-size="10" font-weight="800" letter-spacing="2.4">COOKIE WORKSHOP · 01</text>

  <path d="M80 211h23" stroke="#f08b6b" stroke-width="3" stroke-linecap="round"/>
  <text x="114" y="215" fill="#f5cb56" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="2.4">A BETTER WAY TO MANAGE COOKIES</text>
  <text x="78" y="300" fill="#f6f0df" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="64" font-weight="900" letter-spacing="-3.5">Cookies,</text>
  <text x="78" y="369" fill="url(#gold)" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="64" font-weight="900" letter-spacing="-3.5">under control.</text>
  <text x="79" y="423" fill="#d3cdbd" font-family="system-ui, sans-serif" font-size="19" font-weight="500">Search, edit, and manage the cookies for the site</text>
  <text x="79" y="453" fill="#d3cdbd" font-family="system-ui, sans-serif" font-size="19" font-weight="500">you’re on — all from one tidy popup.</text>

  <!-- Feature list -->
  <g font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f0eadc">
    <g transform="translate(79 499)">
      <rect width="30" height="30" rx="8" fill="#201f1c"/>
      <rect width="30" height="30" rx="8" fill="none" stroke="#5b5547" stroke-width="1.6"/>
      <circle cx="13.6" cy="13.6" r="3.7" fill="none" stroke="#f5cb56" stroke-width="1.8"/><path d="m16.5 16.5 3.5 3.5" stroke="#f5cb56" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <text x="122" y="519">Find cookies in seconds</text>
    <g transform="translate(79 543)">
      <rect width="30" height="30" rx="8" fill="#201f1c"/>
      <rect width="30" height="30" rx="8" fill="none" stroke="#5b5547" stroke-width="1.6"/>
      <use href="#sparkle" x="9" y="9" width="12" height="12"/>
    </g>
    <text x="122" y="563">Fine-tune every detail</text>
    <g transform="translate(79 587)">
      <rect width="30" height="30" rx="8" fill="#201f1c"/>
      <rect width="30" height="30" rx="8" fill="none" stroke="#5b5547" stroke-width="1.6"/>
      <path d="M11 19 19 11m-6 0h6v6" fill="none" stroke="#f5cb56" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="122" y="607">Import, export, and move on</text>
  </g>
  <text x="79" y="747" fill="#aaa391" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Your cookies stay in your browser.</text>

  <!-- Empty screenshot placeholder; drop the overview capture here when composing the final promo. -->
  <g filter="url(#shadow)">
    <rect x="668" y="80" width="540" height="620" rx="18" fill="url(#panel)"/>
    <g clip-path="url(#panelClip)">
      <circle cx="688" cy="103" r="4" fill="#f08b6b"/><circle cx="703" cy="103" r="4" fill="#8d866e"/><circle cx="718" cy="103" r="4" fill="#8d866e"/>
      <text x="737" y="107" fill="#aaa391" font-family="system-ui, sans-serif" font-size="9" font-weight="800" letter-spacing="1.8">COOKIE WORKSHOP  /  EXAMPLE.COM</text>
      <rect x="688" y="139" width="500" height="530.208" fill="#22211e"/>
    </g>
    <rect x="668" y="80" width="540" height="620" rx="18" fill="none" stroke="#4b4639" stroke-width="1.5"/>
  </g>
  <use href="#sparkle" x="1199" y="50" width="24" height="24"/>
  <circle cx="627" cy="701" r="3.5" fill="#f08b6b"/><circle cx="645" cy="713" r="3.5" fill="#f5cb56"/><circle cx="662" cy="697" r="3.5" fill="#8e7940"/>
</svg>
